<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Home</title>
</head>
<body>
  <h1>Home</h1>
  <p>Enter a stock ticker symbol or a company name.</p>

  <form method="get" action="/process">
    <label>
      Search:
      <input type="text" name="search" size="40" required>
    </label>
    <br><br>

    <label><input type="radio" name="how" value="company" checked> Company name</label>
    <br>
    <label><input type="radio" name="how" value="ticker"> Ticker symbol</label>
    <br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
